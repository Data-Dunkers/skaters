<!DOCTYPE html>
<html lang="en" data-page="photobooth-index">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Skaters Photobooth</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="page-header">
        <div class="eyebrow">Data Science x Hockey</div>
        <h1>Data <span>Skaters</span></h1>
        <p>Photobooth Capture for Player Cards</p>
    </div>

    <div class="layout">
        <div class="card">
            <div class="section-label">Camera</div>
            <div class="camera-wrap">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="snapshot" aria-label="Captured photo preview"></canvas>
            </div>
            <p class="camera-hint">
                Allow camera access, frame the player, then capture.<br>You can retake before uploading.
            </p>
            <div class="field extracted-style-1">
                <label for="camera-select">Camera</label>
                <select id="camera-select" disabled>
                    <option value="">Default Camera</option>
                </select>
            </div>
            <div class="controls">
                <button type="button" class="btn" id="start-btn">Start Camera</button>
                <button type="button" class="btn btn-primary" id="capture-btn" disabled>Capture</button>
                <button type="button" class="btn" id="retake-btn" disabled>Retake</button>
            </div>

            <div class="section-label extracted-style-2">Background Removal</div>
            <div class="form-grid">
                <label class="checkbox-row" for="remove-bg">
                    <input type="checkbox" id="remove-bg" checked>
                    Remove solid background
                </label>

                <div class="field">
                    <label for="key-color">Key Color</label>
                    <input type="color" id="key-color" value="#00a651">
                </div>

                <div class="field">
                    <label for="tolerance">Tolerance</label>
                    <div class="range-wrap">
                        <input type="range" id="tolerance" min="10" max="220" value="95">
                        <span id="tolerance-value" class="range-value">95</span>
                    </div>
                </div>

                <div class="field">
                    <label for="softness">Edge Softness</label>
                    <div class="range-wrap">
                        <input type="range" id="softness" min="0" max="90" value="20">
                        <span id="softness-value" class="range-value">20</span>
                    </div>
                </div>

                <button type="button" class="btn" id="pick-color-btn" disabled>Pick Color From Photo</button>
            </div>
        </div>

        <div class="card">
            <div class="section-label">Upload Details</div>
            <form id="upload-form" class="form-grid" novalidate>
                <div class="field">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="nickname" placeholder="PS43" required oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')">
                </div>

                <div class="field">
                    <label for="real-name">Real Name</label>
                    <input type="text" id="real-name" name="real_name" placeholder="Optional">
                    <div class="optional-note">Optional field</div>
                </div>

                <button type="submit" class="btn btn-primary" id="upload-btn" disabled>Upload Photo</button>
            </form>
            <div id="status" class="status">Start camera to begin.</div>
        </div>
    </div>

    <div class="home-link-wrap"><a class="home-link" href="../index.html">Home</a></div>

    <script>
        const POCKETBASE_URL = 'https://api.datadunkers.ca';
        const COLLECTION_NAME = 'data_skaters_photos';

        const video = document.getElementById('video');
        const canvas = document.getElementById('snapshot');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const cameraSelect = document.getElementById('camera-select');
        const uploadBtn = document.getElementById('upload-btn');
        const uploadForm = document.getElementById('upload-form');
        const nicknameInput = document.getElementById('nickname');
        const realNameInput = document.getElementById('real-name');
        const statusEl = document.getElementById('status');
        const removeBgInput = document.getElementById('remove-bg');
        const keyColorInput = document.getElementById('key-color');
        const toleranceInput = document.getElementById('tolerance');
        const softnessInput = document.getElementById('softness');
        const toleranceValue = document.getElementById('tolerance-value');
        const softnessValue = document.getElementById('softness-value');
        const pickColorBtn = document.getElementById('pick-color-btn');

        const eventKey = localStorage.getItem('event_key');
        if (!eventKey) {
            window.location.href = '../index.html';
        }

        let stream = null;
        let photoBlob = null;
        let selectedDeviceId = '';
        let originalImageData = null;
        let isPickingColor = false;

        function setStatus(message, type) {
            statusEl.textContent = message;
            statusEl.classList.remove('success', 'error');
            if (type) {
                statusEl.classList.add(type);
            }
        }

        function setCaptureState(isCaptured) {
            if (isCaptured) {
                video.style.display = 'none';
                canvas.style.display = 'block';
                retakeBtn.disabled = false;
                uploadBtn.disabled = false;
                captureBtn.disabled = true;
                pickColorBtn.disabled = false;
            } else {
                video.style.display = 'block';
                canvas.style.display = 'none';
                retakeBtn.disabled = true;
                uploadBtn.disabled = true;
                captureBtn.disabled = !stream;
                pickColorBtn.disabled = true;
                isPickingColor = false;
                canvas.classList.remove('picker-active');
                pickColorBtn.textContent = 'Pick Color From Photo';
            }
        }

        function hexToRgb(hex) {
            const normalized = hex.replace('#', '');
            const value = parseInt(normalized, 16);
            return {
                r: (value >> 16) & 255,
                g: (value >> 8) & 255,
                b: value & 255
            };
        }

        function rgbToHex(r, g, b) {
            const clamp = (n) => Math.max(0, Math.min(255, n));
            const toHex = (n) => clamp(n).toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        }

        function renderProcessedImage() {
            if (!originalImageData) {
                return;
            }

            const width = originalImageData.width;
            const height = originalImageData.height;
            const working = new ImageData(new Uint8ClampedArray(originalImageData.data), width, height);

            if (removeBgInput.checked) {
                const keyRgb = hexToRgb(keyColorInput.value);
                const tolerance = Number(toleranceInput.value);
                const softness = Number(softnessInput.value);
                const startFade = Math.max(0, tolerance - softness);
                const endFade = tolerance + softness;

                for (let i = 0; i < working.data.length; i += 4) {
                    const r = working.data[i];
                    const g = working.data[i + 1];
                    const b = working.data[i + 2];

                    const distance = Math.sqrt(
                        (r - keyRgb.r) * (r - keyRgb.r) +
                        (g - keyRgb.g) * (g - keyRgb.g) +
                        (b - keyRgb.b) * (b - keyRgb.b)
                    );

                    let alpha;
                    if (distance <= startFade) {
                        alpha = 0;
                    } else if (distance >= endFade || endFade <= startFade) {
                        alpha = 255;
                    } else {
                        const t = (distance - startFade) / (endFade - startFade);
                        alpha = Math.max(0, Math.min(255, Math.round(255 * t)));
                    }

                    working.data[i + 3] = alpha;
                }
            }

            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            context.putImageData(working, 0, 0);

            canvas.toBlob((blob) => {
                if (blob) {
                    photoBlob = blob;
                }
            }, 'image/png');
        }

        function refreshControlLabels() {
            toleranceValue.textContent = toleranceInput.value;
            softnessValue.textContent = softnessInput.value;
        }

        function setColorPickerMode(enabled) {
            if (!originalImageData) {
                return;
            }

            isPickingColor = enabled;
            if (enabled) {
                canvas.classList.add('picker-active');
                pickColorBtn.textContent = 'Cancel Color Pick';
                setStatus('Click on the captured image to pick background color.');
            } else {
                canvas.classList.remove('picker-active');
                pickColorBtn.textContent = 'Pick Color From Photo';
            }
        }

        function pickColorFromCanvas(event) {
            if (!isPickingColor || !originalImageData) {
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const x = Math.max(0, Math.min(canvas.width - 1,
                Math.floor(((event.clientX - rect.left) / rect.width) * canvas.width)));
            const y = Math.max(0, Math.min(canvas.height - 1,
                Math.floor(((event.clientY - rect.top) / rect.height) * canvas.height)));

            const idx = ((y * originalImageData.width) + x) * 4;
            const data = originalImageData.data;
            keyColorInput.value = rgbToHex(data[idx], data[idx + 1], data[idx + 2]);
            setColorPickerMode(false);
            renderProcessedImage();
            setStatus('Background color updated from clicked pixel.');
        }

        function stopCurrentStream() {
            if (stream) {
                stream.getTracks().forEach((track) => track.stop());
                stream = null;
                video.srcObject = null;
            }
        }

        function getCameraFailureHelp(error) {
            if (!window.isSecureContext) {
                return 'Camera requires a secure context. Use https:// or http://localhost.';
            }

            if (!error || !error.name) {
                return 'Please check browser camera permissions and try again.';
            }

            if (error.name === 'NotAllowedError' || error.name === 'SecurityError') {
                return 'Camera permission was denied. Allow camera access in browser site settings.';
            }

            if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
                return 'No webcam was found. Connect a camera and retry.';
            }

            if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
                return 'Camera is busy in another app. Close Teams/Zoom/OBS and retry.';
            }

            if (error.name === 'OverconstrainedError' || error.name === 'ConstraintNotSatisfiedError') {
                return 'Selected camera constraints were not supported. Try another camera.';
            }

            return `${error.name}: ${error.message || 'Unknown camera error.'}`;
        }

        async function loadVideoDevices() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                return;
            }

            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameras = devices.filter((device) => device.kind === 'videoinput');
            const currentValue = cameraSelect.value;

            cameraSelect.innerHTML = '';

            if (!cameras.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'No camera detected';
                cameraSelect.appendChild(option);
                cameraSelect.disabled = true;
                return;
            }

            cameras.forEach((camera, index) => {
                const option = document.createElement('option');
                option.value = camera.deviceId;
                option.textContent = camera.label || `Camera ${index + 1}`;
                cameraSelect.appendChild(option);
            });

            cameraSelect.disabled = false;
            const availableIds = cameras.map((camera) => camera.deviceId);
            const preferredId = selectedDeviceId || currentValue;
            if (preferredId && availableIds.includes(preferredId)) {
                cameraSelect.value = preferredId;
            } else {
                cameraSelect.selectedIndex = 0;
                selectedDeviceId = cameraSelect.value;
            }
        }

        async function startCamera(deviceId) {
            stopCurrentStream();

            try {
                const attempts = [];

                if (deviceId) {
                    attempts.push({
                        video: {
                            deviceId: { exact: deviceId },
                            width: { ideal: 1280 },
                            height: { ideal: 960 }
                        },
                        audio: false
                    });
                }

                attempts.push({
                    video: {
                        facingMode: { ideal: 'user' },
                        width: { ideal: 1280 },
                        height: { ideal: 960 }
                    },
                    audio: false
                });

                attempts.push({ video: true, audio: false });

                let lastError = null;
                for (const constraints of attempts) {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia(constraints);
                        break;
                    } catch (error) {
                        lastError = error;
                    }
                }

                if (!stream) {
                    throw lastError || new Error('Unable to open any camera stream.');
                }

                video.srcObject = stream;
                await video.play();

                const [track] = stream.getVideoTracks();
                const trackSettings = track ? track.getSettings() : {};
                if (trackSettings.deviceId) {
                    selectedDeviceId = trackSettings.deviceId;
                }

                await loadVideoDevices();
                if (selectedDeviceId) {
                    cameraSelect.value = selectedDeviceId;
                }

                captureBtn.disabled = false;
                startBtn.disabled = true;
                setStatus('Camera ready. Capture when the player is framed.');
            } catch (error) {
                captureBtn.disabled = true;
                startBtn.disabled = false;
                setStatus(`Camera access failed. ${getCameraFailureHelp(error)}`, 'error');
            }
        }

        async function onCameraChange() {
            const nextDeviceId = cameraSelect.value;
            if (!nextDeviceId) {
                return;
            }

            selectedDeviceId = nextDeviceId;
            photoBlob = null;
            setCaptureState(false);
            await startCamera(nextDeviceId);
        }

        function capturePhoto() {
            if (!stream) {
                return;
            }

            const width = video.videoWidth;
            const height = video.videoHeight;

            if (!width || !height) {
                setStatus('Camera is still warming up. Try again in a second.', 'error');
                return;
            }

            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, width, height);

            canvas.toBlob((blob) => {
                if (!blob) {
                    setStatus('Could not capture image. Please retake.', 'error');
                    return;
                }

                photoBlob = blob;
                const context = canvas.getContext('2d');
                originalImageData = context.getImageData(0, 0, width, height);
                renderProcessedImage();
                setCaptureState(true);
                setStatus(removeBgInput.checked
                    ? 'Photo captured with transparent preview. Adjust sliders if needed, then upload.'
                    : 'Photo captured. Fill details and upload.');
            }, 'image/png');
        }

        function retakePhoto() {
            photoBlob = null;
            originalImageData = null;
            setColorPickerMode(false);
            setCaptureState(false);
            setStatus('Retake ready. Capture a new photo.');
        }

        async function uploadRecord(event) {
            event.preventDefault();

            const nickname = nicknameInput.value.trim();
            const realName = realNameInput.value.trim();

            if (!nickname) {
                setStatus('Nickname is required.', 'error');
                nicknameInput.focus();
                return;
            }

            if (!photoBlob) {
                setStatus('Capture a photo before uploading.', 'error');
                return;
            }

            const fileName = `${nickname.replace(/[^a-zA-Z0-9_-]/g, '_')}_${Date.now()}.png`;
            const photoFile = new File([photoBlob], fileName, { type: 'image/png' });

            const formData = new FormData();
            formData.append('nickname', nickname);
            formData.append('real_name', realName);
            formData.append('photo', photoFile);
            formData.append('event_key', eventKey);

            uploadBtn.disabled = true;
            setStatus('Uploading to PocketBase...');

            try {
                const response = await fetch(`${POCKETBASE_URL}/api/collections/${COLLECTION_NAME}/records`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorBody = await response.text();
                    throw new Error(errorBody || `Upload failed with status ${response.status}`);
                }

                const record = await response.json();
                setStatus(`Upload complete. Record saved: ${record.id}`, 'success');
                nicknameInput.value = '';
                realNameInput.value = '';
                photoBlob = null;
                setCaptureState(false);
            } catch (error) {
                setStatus(`Upload failed. ${error.message}`, 'error');
            } finally {
                uploadBtn.disabled = !photoBlob;
            }
        }

        startBtn.addEventListener('click', () => {
            const deviceId = cameraSelect.value || selectedDeviceId;
            startCamera(deviceId);
        });
        captureBtn.addEventListener('click', capturePhoto);
        retakeBtn.addEventListener('click', retakePhoto);
        cameraSelect.addEventListener('change', onCameraChange);
        removeBgInput.addEventListener('change', () => {
            if (originalImageData) {
                renderProcessedImage();
            }
        });
        keyColorInput.addEventListener('input', () => {
            if (originalImageData) {
                renderProcessedImage();
            }
        });
        toleranceInput.addEventListener('input', () => {
            refreshControlLabels();
            if (originalImageData) {
                renderProcessedImage();
            }
        });
        softnessInput.addEventListener('input', () => {
            refreshControlLabels();
            if (originalImageData) {
                renderProcessedImage();
            }
        });
        pickColorBtn.addEventListener('click', () => {
            if (!originalImageData) {
                return;
            }

            setColorPickerMode(!isPickingColor);
        });
        canvas.addEventListener('click', pickColorFromCanvas);
        uploadForm.addEventListener('submit', uploadRecord);

        if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
            navigator.mediaDevices.addEventListener('devicechange', () => {
                loadVideoDevices().catch(() => {
                    // Ignore transient device enumeration errors.
                });
            });
        }

        loadVideoDevices().catch(() => {
            // Device labels are often unavailable until camera permission is granted.
        });

        refreshControlLabels();

        window.addEventListener('beforeunload', () => {
            stopCurrentStream();
        });
    </script>
</body>
</html>
