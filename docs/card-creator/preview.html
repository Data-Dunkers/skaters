<!DOCTYPE html>
<html lang="en" data-page="card-creator-v2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Skaters - Archetype Background Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="card.css">
<script src="backgrounds.js"></script>
<style>
  body {
    background: #0b1d33;
    color: #e2eef9;
    padding: 30px;
    font-family: 'Barlow', sans-serif;
  }
  .preview-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .preview-header h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 42px;
    letter-spacing: 1px;
    color: #ffffff;
    margin: 0 0 10px 0;
  }
  .preview-header p {
    color: #8bbbe2;
    font-size: 18px;
    margin: 0;
  }
  .cards-grid {
    display: flex;
    flex-direction: column;
    gap: 50px;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .card-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #79c0ff;
    text-transform: uppercase;
  }
  .card-scene {
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="preview-header">
  <h1>Data Skaters – Archetype Backgrounds</h1>
  <p>6 distinct themed backgrounds matching the blue, ice, and navy palette</p>
</div>

<div class="cards-grid" id="preview-container"></div>

<script>
const ARCHETYPES = [
  { name: 'Playmaker', desc: 'Arena floodlights & crystalline ice facets' },
  { name: 'Power Forward', desc: 'Bold geometric athletic wedges & speed chevrons' },
  { name: 'Two-Way Forward', desc: 'Deep arctic frozen lake with cracked ice fissures' },
  { name: 'Speed Winger', desc: 'Flowing aerodynamic wind-tunnel ribbons & electric neon accents' },
  { name: 'Sniper', desc: 'Technical blueprint coordinate grid & precision targeting reticles' },
  { name: 'Defenseman', desc: 'Glacial fortress ice wall & heavy defensive armor bastion plates' }
];

const AXES = ['Sniper', 'Speed Winger', 'Playmaker', 'Defenseman', 'Power Forward', 'Two-way Forward'];
const HEAT_KEYS = ['height_cm', 'reaction_time_ms', 'resting_heart_rate', 'skate_size', 'wingspan_cm'];
const HEAT_LABELS = {
    height_cm: 'Height',
    reaction_time_ms: 'Reaction Time',
    resting_heart_rate: 'Resting Heart Rate',
    skate_size: 'Skate Size',
    wingspan_cm: 'Wingspan'
};

const SAMPLE_CORR = [
  [ 1.00,  0.12, -0.05,  0.97,  0.99],
  [ 0.12,  1.00,  0.16,  0.14,  0.11],
  [-0.05,  0.16,  1.00, -0.05, -0.03],
  [ 0.97,  0.14, -0.05,  1.00,  0.95],
  [ 0.99,  0.11, -0.03,  0.95,  1.00]
];

function correlationColor(value) {
    const start = [236, 28, 36];
    const end = [0, 118, 206];
    const t = Math.max(0, Math.min(1, (value + 1) / 2));
    const color = start.map((channel, i) => Math.round(channel + (end[i] - channel) * t));
    return `rgb(${color[0]},${color[1]},${color[2]})`;
}

function buildRadar(el, values) {
    const cx = 175, cy = 112, R = 70;
    const pt = (i, r) => {
        const a = (-90 + i * 60) * Math.PI / 180;
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    };
    const poly = values.map((v, i) => pt(i, R * (0.08 + 0.92 * v)).map(n => n.toFixed(1)).join(',')).join(' ');
    let svg = `<svg width="330" height="225" viewBox="0 0 330 225" xmlns="http://www.w3.org/2000/svg" style="position:absolute;left:0;top:0">`;
    [1 / 3, 2 / 3, 1].forEach(f => {
        svg += `<circle cx="${cx}" cy="${cy}" r="${R * f}" fill="none" stroke="#d3d9e3" stroke-width="1"/>`;
    });
    for (let i = 0; i < 6; i++) {
        const [x, y] = pt(i, R);
        svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#d3d9e3" stroke-width="1"/>`;
    }
    svg += `<polygon points="${poly}" fill="#0076CE" fill-opacity="0.45" stroke="#0076CE" stroke-width="1.5" stroke-linejoin="round"/>`;
    svg += `</svg>`;

    const labelPos = [
        'left:175px;top:6px;transform:translateX(-50%)',
        'left:246px;top:69px',
        'left:246px;top:139px',
        'left:175px;top:196px;transform:translateX(-50%)',
        'right:226px;top:139px',
        'right:226px;top:69px'
    ];
    const labels = AXES.map((a, i) => `<span class="rlabel" style="${labelPos[i]}">${a}</span>`).join('');
    el.innerHTML = svg + labels;
}

function buildHeat(el, corr) {
    const x0 = 130, y0 = 30, cw = 34, ch = 30, W = 330;
    let html = '<span class="htitle">Correlation Heat Map</span>';
    HEAT_KEYS.forEach((k, r) => {
        html += `<span class="hrow" style="right:${W - (x0 - 8)}px;top:${y0 + r * ch + 7}px">${HEAT_LABELS[k]}</span>`;
        HEAT_KEYS.forEach((_, c) => {
            const v = corr ? corr[r][c] : 0;
            const color = correlationColor(v);
            html += `<div class="hcell" style="left:${x0 + c * cw}px;top:${y0 + r * ch}px;background:${color};color:#fff">${v.toFixed(2)}</div>`;
        });
    });
    HEAT_KEYS.forEach((k, c) => {
        html += `<span class="hcol" style="right:${W - (x0 + c * cw + cw / 2)}px;top:${y0 + HEAT_KEYS.length * ch + 6}px">${HEAT_LABELS[k]}</span>`;
    });
    el.innerHTML = html;
}

function createCard(archetypeObj) {
  const archName = archetypeObj.name;
  const archKey = normalizeArchetype(archName);
  const bgSvg = getArchetypeBackgroundSvg(archKey);

  const card = document.createElement('div');
  card.className = `card-scene arch-${archKey}`;

  // Archetype radar bias
  const radarMap = {
    'playmaker': [0.4, 0.45, 0.95, 0.4, 0.5, 0.6],
    'power-forward': [0.35, 0.4, 0.5, 0.7, 0.95, 0.6],
    'two-way-forward': [0.5, 0.55, 0.4, 0.45, 0.5, 0.95],
    'speed-winger': [0.6, 0.95, 0.4, 0.35, 0.4, 0.5],
    'sniper': [0.95, 0.45, 0.35, 0.3, 0.4, 0.55],
    'defenseman': [0.35, 0.3, 0.5, 0.95, 0.6, 0.45]
  };
  const radarVals = radarMap[archKey] || [0.5, 0.5, 0.5, 0.5, 0.5, 0.5];

  card.innerHTML = `
    ${bgSvg}

    <div class="card-left">
      <div class="name-block">
        <span>WAHNEENOSH</span>
        <span>LITTLECHILD</span>
      </div>
      <img class="logo-event" src="ocap-logo.png" alt="OCAP">

      <div class="photo-frame">
        <div class="photo-img" style="background:#ffffff;display:flex;align-items:center;justify-content:center;color:#b0c7dc;font-size:20px;font-weight:600;">
          PLAYER PHOTO
        </div>
      </div>

      <div class="banner">
        <div class="arch-bg"></div>
        <div class="num-bg"></div>
        <div class="arch-text">${archName.toUpperCase()}</div>
        <div class="num-text">67</div>
      </div>
    </div>

    <div class="card-right">
      <div class="nick-title">WL67</div>

      <div class="stats-col">
        <div class="stat"><span class="lbl">Height</span><span class="val">178 cm</span></div>
        <div class="stat"><span class="lbl">Wingspan</span><span class="val">177 cm</span></div>
        <div class="stat"><span class="lbl">Reaction</span><span class="val">251 ms</span></div>
        <div class="stat"><span class="lbl">Resting HR</span><span class="val">60 bpm</span></div>
        <div class="stat"><span class="lbl">Skate Size</span><span class="val">9</span></div>
        <div class="stat"><span class="lbl">Handedness</span><span class="val">Right</span></div>
        <div class="stat"><span class="lbl">Birth Month</span><span class="val">October</span></div>
        <div class="stat"><span class="lbl">Shot %</span><span class="val">75</span></div>
        <div class="stat"><span class="lbl">Esport Score</span><span class="val">88</span></div>
      </div>

      <div class="panel radar-panel"></div>
      <div class="panel heat-panel"></div>

      <div class="logos-row">
        <img src="ps43-foundation-logo.png" alt="PS43">
        <img src="dell-logo-black.png" alt="Dell">
        <img src="lotus-8-esports-logo.png" alt="Lotus 8">
        <img src="mfnerc-logo.png" alt="MFNERC">
      </div>
    </div>
  `;

  buildRadar(card.querySelector('.radar-panel'), radarVals);
  buildHeat(card.querySelector('.heat-panel'), SAMPLE_CORR);

  const wrapper = document.createElement('div');
  wrapper.className = 'card-wrapper';

  const label = document.createElement('div');
  label.className = 'card-label';
  label.textContent = `${archName} – ${archetypeObj.desc}`;

  wrapper.appendChild(label);
  wrapper.appendChild(card);
  return wrapper;
}

const container = document.getElementById('preview-container');
ARCHETYPES.forEach(arch => {
  container.appendChild(createCard(arch));
});
</script>

</body>
</html>
