<!DOCTYPE html>
<html lang="en" data-page="input-index">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Skaters Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <script src="../event-key-bg.js"></script>
</head>
<body>

<div class="page-header">
    <div class="eyebrow">Data Science × Hockey</div>
    <h1>Data <span>Skaters</span></h1>
</div>

<!-- ── FORM CARD ── -->
<div class="card extracted-style-1">

    <div class="form-section">
        <div class="form-row cols-2">
            <div class="form-group">
                <label for="group">Group #</label>
                <input type="number" id="group" name="group" placeholder="e.g. 3" min="1" required>
            </div>
            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" placeholder="PS43" required oninput="validateNickname()" onblur="updateStats(this.value.trim())" maxlength="4" autocomplete="off">
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="section-label">Shots Made (out of 6)</div>
        <div class="distance-rows">
            <div class="distance-row" data-distance="2">
                <span class="distance-label">2 ft</span>
                <div class="option-group" role="group" aria-label="Shots made at 2 feet">
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 0)">0</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 1)">1</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 2)">2</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 3)">3</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 4)">4</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 5)">5</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 6)">6</button>
                </div>
                <input type="hidden" class="shots-made-value">
            </div>
            <div class="distance-row" data-distance="5">
                <span class="distance-label">5 ft</span>
                <div class="option-group" role="group" aria-label="Shots made at 5 feet">
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 0)">0</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 1)">1</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 2)">2</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 3)">3</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 4)">4</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 5)">5</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 6)">6</button>
                </div>
                <input type="hidden" class="shots-made-value">
            </div>
            <div class="distance-row" data-distance="7">
                <span class="distance-label">7 ft</span>
                <div class="option-group" role="group" aria-label="Shots made at 7 feet">
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 0)">0</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 1)">1</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 2)">2</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 3)">3</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 4)">4</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 5)">5</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 6)">6</button>
                </div>
                <input type="hidden" class="shots-made-value">
            </div>
            <div class="distance-row" data-distance="10">
                <span class="distance-label">10 ft</span>
                <div class="option-group" role="group" aria-label="Shots made at 10 feet">
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 0)">0</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 1)">1</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 2)">2</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 3)">3</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 4)">4</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 5)">5</button>
                    <button type="button" class="option-btn" aria-pressed="false" onclick="selectDistanceShots(this, 6)">6</button>
                </div>
                <input type="hidden" class="shots-made-value">
            </div>
        </div>
    </div>

    <button type="button" class="submit-btn" id="submitBtn" onclick="handleSubmit()">Log Data</button>
    <div id="statusMessage"></div>
</div>

<!-- ── HISTORY CARD ── -->
<div class="history-card">
    <div class="history-header">
        <h2>Shot History</h2>
        <span id="statsFor">—</span>
    </div>
    <div id="emptyState">No shots logged yet.</div>
    <table id="statsTable" class="extracted-style-2">
        <thead>
            <tr>
                <th>Distance</th>
                <th>Shots Made</th>
            </tr>
        </thead>
        <tbody id="statsBody"></tbody>
    </table>
</div>

<div class="home-link-wrap"><a class="home-link" href="../index.html">Home</a></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
const PB_URL = 'https://api.datadunkers.ca/api/collections/data_skaters_shots/records';

// ── ON LOAD ─────────────────────────────────────────────────────
window.onload = () => {
    const eventKey = localStorage.getItem('event_key');
    if (!eventKey) {
        window.location.href = '../index.html';
        return;
    }

    //const savedNick  = localStorage.getItem('lastNickname');
    const savedGroup = localStorage.getItem('lastGroup');
    //if (savedNick)  document.getElementById('nickname').value = savedNick;
    if (savedGroup) document.getElementById('group').value = savedGroup;
    //if (savedNick)  updateStats(savedNick);
};

// ── NICKNAME VALIDATION ───────────────────────────────────────
function validateNickname() {
    let val = document.getElementById('nickname').value.toUpperCase();
    let result = '';
    
    for (let i = 0; i < val.length && i < 4; i++) {
        let char = val[i];
        if (i < 2 && /[A-Z]/.test(char)) {
            result += char; // First 2 characters must be letters
        } else if (i >= 2 && /[0-9]/.test(char)) {
            result += char; // Last 2 characters must be numbers
        }
    }
    document.getElementById('nickname').value = result;
}


// ── SHOTS-MADE BUTTON SELECTION ────────────────────────────────
function selectDistanceShots(btn, value) {
    const row = btn.closest('.distance-row');
    row.querySelector('.shots-made-value').value = value;
    row.querySelectorAll('.option-btn').forEach(button => {
        button.classList.remove('active');
        button.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
}

// ── SUBMIT ───────────────────────────────────────────────────────
async function handleSubmit() {
    const group    = document.getElementById('group').value.trim();
    const nick     = document.getElementById('nickname').value.trim();
    const selectedRows = Array.from(document.querySelectorAll('.distance-row'))
        .filter(row => row.querySelector('.shots-made-value').value !== '');
    
    if (!group || !nick || selectedRows.length === 0) {
        showStatus('Please fill in all required fields.', 'error'); return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Logging data…';

    try {
        localStorage.setItem('lastGroup', group);

        let loggedCount = 0;
        const failures = [];
        for (const row of selectedRows) {
            const distance = row.dataset.distance;
            const payload = {
                group: parseInt(group, 10),
                nickname: nick,
                distance: parseInt(distance, 10),
                shots_made: parseInt(row.querySelector('.shots-made-value').value, 10),
                event_key: localStorage.getItem('event_key'),
            };

            try {
                const res = await fetch(PB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) throw new Error(`Server error ${res.status}`);
                loggedCount++;
            } catch (err) {
                failures.push(`${distance} ft (${err.message})`);
            }
        }

        await updateStats(nick);
        if (failures.length > 0) {
            const loggedLabel = loggedCount === 1 ? 'distance' : 'distances';
            const loggedMessage = loggedCount ? `${loggedCount} ${loggedLabel} logged. ` : '';
            showStatus(`${loggedMessage}Failed: ${failures.join(', ')}`, 'error');
        } else {
            const distanceLabel = loggedCount === 1 ? 'distance' : 'distances';
            showStatus(`${loggedCount} ${distanceLabel} logged! ✓`, 'success');
        }
    } finally {
        btn.disabled = false;
        btn.textContent = 'Log Data';
    }
}

// ── STATUS MESSAGE ───────────────────────────────────────────────
function showStatus(msg, type) {
    const el = document.getElementById('statusMessage');
    el.textContent = msg;
    el.className = type === 'success' ? 'status-success' : 'status-error';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
}

// ── HISTORY TABLE ────────────────────────────────────────────────
async function updateStats(nick) {
    document.getElementById('statsFor').textContent = nick;
    try {
        const key = localStorage.getItem('event_key');
        const res  = await fetch(`${PB_URL}?filter=(nickname='${nick}'%20%26%26%20event_key='${key}')&sort=-created&perPage=50`);
        const data = await res.json();
        const tbody = document.getElementById('statsBody');
        const table = document.getElementById('statsTable');
        const empty = document.getElementById('emptyState');
        const distanceRows = document.querySelectorAll('.distance-row');

        tbody.innerHTML = '';
        distanceRows.forEach(row => row.querySelectorAll('.option-btn').forEach(button => button.disabled = false));

        if (!data.items || data.items.length === 0) {
            table.style.display = 'none';
            empty.style.display = 'block';
            return;
        }

        table.style.display = 'table';
        empty.style.display = 'none';

        const recordedDistances = new Set(data.items.map(record => String(record.distance)));
        distanceRows.forEach(row => {
            if (!recordedDistances.has(row.dataset.distance)) return;
            row.querySelectorAll('.option-btn').forEach(button => {
                button.disabled = true;
                button.classList.remove('active');
                button.setAttribute('aria-pressed', 'false');
            });
            row.querySelector('.shots-made-value').value = '';
        });

        data.items.forEach((r) => {
            tbody.innerHTML += `<tr>
                <td>${r.distance}</td>
                <td>${r.shots_made}</td>
            </tr>`;
        });
    } catch (err) {
        console.error('Stats fetch failed:', err);
    }
}
</script>
</body>
</html>
