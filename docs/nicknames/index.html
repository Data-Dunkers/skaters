<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicknames</title>
    <link rel="stylesheet" href="../auto-refresh.css">
    <script src="../event-key-bg.js"></script>
    <script src="../auto-refresh.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 1rem; background: #111; color: #fff; }
        .home-link { display: inline-block; margin-bottom: 1rem; padding: 0.5rem 1rem; border: 2px solid #888;
            border-radius: 6px; background: #222; color: #fff; text-decoration: none; font-size: 1.2rem; }
        .top-bar { display: flex; flex-wrap: wrap; column-gap: 0.5rem; align-items: flex-start; }
        .autorefresh-label { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; margin-bottom: 1rem; }
        .selection-actions { display: flex; gap: 0.5rem; margin: 0 0 1rem auto; }
        .selection-actions button { padding: 0.5rem 1rem; border: 2px solid #888; border-radius: 6px;
            background: #222; color: #fff; font-size: 1.2rem; cursor: pointer; }
        #status { margin-bottom: 1rem; opacity: 0.8; }
        #buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        #buttons button { font-size: 1.2rem; padding: 0.5rem 1rem; border: 2px solid #888; border-radius: 6px;
            background: #222; color: #fff; cursor: pointer; }
        #buttons button.on { background: #2a7; border-color: #2a7; }
        #photos { display: flex; flex-wrap: wrap; gap: 1rem; }
        figure { margin: 0; text-align: center; }
        figure img { max-width: 300px; max-height: 300px; display: block; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="home-link" href="../index.html">Home</a>
        <label class="autorefresh-label">
            <input type="checkbox" id="autorefresh-toggle"> Auto-refresh every minute
            <span id="autorefresh-countdown" class="autorefresh-countdown" aria-hidden="true" hidden><span></span></span>
        </label>
        <div class="selection-actions">
            <button id="select-all-btn" type="button">Select All</button>
            <button id="clear-btn" type="button">Clear All</button>
        </div>
    </div>
    <div id="status">Loading...</div>
    <div id="buttons"></div>
    <div id="photos"></div>

    <script>
        const POCKETBASE_URL = 'https://api.datadunkers.ca';
        const COLLECTION_NAME = 'data_skaters_photos';
        const SELECTION_KEY = 'nicknames_photo_selection';
        const AUTOREFRESH_KEY = 'nicknames_autorefresh';
        const REFRESH_INTERVAL_MS = 60_000;
        const eventKey = localStorage.getItem('event_key');
        const statusEl = document.getElementById('status');
        const buttonsEl = document.getElementById('buttons');
        const photosEl = document.getElementById('photos');
        let showAll = localStorage.getItem(SELECTION_KEY) !== 'clear';
        let loading = false;

        async function fetchLatestPhotoRecords() {
            const recordsByNickname = new Map();
            for (let page = 1; ; page++) {
                const params = new URLSearchParams({
                    filter: `event_key = "${eventKey.replace(/["\\]/g, '')}"`,
                    perPage: '200',
                    page: String(page),
                    sort: 'nickname,-created,-id'
                });
                const response = await fetch(`${POCKETBASE_URL}/api/collections/${COLLECTION_NAME}/records?${params}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`status ${response.status}`);
                const data = await response.json();
                for (const record of data.items || []) {
                    if (record.photo && !recordsByNickname.has(record.nickname)) {
                        recordsByNickname.set(record.nickname, record);
                    }
                }
                if (page >= data.totalPages) break;
            }
            return [...recordsByNickname.values()];
        }

        async function downloadPhoto(record) {
            const url = `${POCKETBASE_URL}/api/files/${COLLECTION_NAME}/${record.id}/${encodeURIComponent(record.photo)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`status ${response.status}`);
            return URL.createObjectURL(await response.blob());
        }

        function addToggle(record) {
            const figure = document.createElement('figure');
            figure.hidden = !showAll;
            const img = document.createElement('img');
            img.src = record._src;
            img.alt = record.nickname;
            const caption = document.createElement('figcaption');
            caption.textContent = record.nickname;
            figure.append(img, caption);
            photosEl.append(figure);

            const button = document.createElement('button');
            button.textContent = record.nickname;
            button.classList.toggle('on', showAll);
            button.addEventListener('click', () => {
                figure.hidden = !figure.hidden;
                button.classList.toggle('on', !figure.hidden);
            });
            buttonsEl.append(button);
        }

        async function loadPhotos() {
            if (!eventKey) {
                statusEl.textContent = 'No event key set. Set one on the home page first.';
                return;
            }
            if (loading) return;
            loading = true;
            try {
                const records = await fetchLatestPhotoRecords();
                let failed = 0;
                let done = 0;
                await Promise.all(records.map(async (record) => {
                    try {
                        record._src = await downloadPhoto(record);
                    } catch (e) {
                        failed++;
                    }
                    statusEl.textContent = `Downloading photos... ${++done}/${records.length}`;
                }));
                const previousPhotos = photosEl.querySelectorAll('img');
                buttonsEl.replaceChildren();
                photosEl.replaceChildren();
                previousPhotos.forEach((img) => URL.revokeObjectURL(img.src));
                showAll = localStorage.getItem(SELECTION_KEY) !== 'clear';
                records.filter((r) => r._src).forEach(addToggle);
                statusEl.textContent = `Event ${eventKey}: ${records.length - failed} nicknames` +
                    (failed ? ` (${failed} photos failed to download)` : '') + '. Tap a nickname to show/hide its photo.';
            } catch (error) {
                statusEl.textContent = `Could not load photos (${error.message}).`;
            } finally {
                loading = false;
            }
        }

        document.getElementById('select-all-btn').addEventListener('click', () => {
            showAll = true;
            localStorage.setItem(SELECTION_KEY, 'select');
            buttonsEl.querySelectorAll('button:not(.on)').forEach((button) => button.click());
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            showAll = false;
            localStorage.setItem(SELECTION_KEY, 'clear');
            buttonsEl.querySelectorAll('button.on').forEach((b) => b.click());
        });

        document.getElementById('autorefresh-toggle').disabled = !eventKey;
        loadPhotos();
        setupAutoRefresh({ storageKey: AUTOREFRESH_KEY, interval: REFRESH_INTERVAL_MS, refresh: loadPhotos });
    </script>
</body>
</html>
