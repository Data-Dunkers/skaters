<!DOCTYPE html>
<html lang="en" data-page="collected-index">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Skaters - Collected Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="../event-key-bg.js"></script>
</head>
<body>
    <div class="page-header">
        <a href="../index.html" class="extracted-style-1">&larr; Back to Home</a>
        <div class="eyebrow">Data Skaters</div>
        <h1>Collected <span>Data</span></h1>
    </div>

    <div class="card">
        <div id="progress-container">
            <h2 class="section-label extracted-style-2">Downloading Data...</h2>
            <progress id="data-progress" value="0" max="100"></progress>
            <div id="status-text" class="status-text">Connecting to api.datadunkers.ca...</div>
        </div>

        <div id="tables-container">
            <div id="filter-container" class="filter-container extracted-style-3">
                <label class="status-text autorefresh-label">
                    <input type="checkbox" id="autorefresh-toggle"> Auto-refresh every minute
                </label>
                <label for="date-select" class="status-text">Filter by Date:</label>
                <select id="date-select">
                    <option value="All Dates">All Dates</option>
                </select>
                <label for="group-select" class="status-text">Filter by Group:</label>
                <select id="group-select">
                    <option value="All Groups">All Groups</option>
                </select>
            </div>

            <div class="section-label extracted-style-3" id="submission-label">Data Submissions</div>
            <div class="table-container extracted-style-3" id="submission-container">
                <table id="submission-table">
                    <thead>
                        <!-- Headings injected by JS -->
                    </thead>
                    <tbody>
                        <!-- Data injected by JS -->
                    </tbody>
                </table>
            </div>
            <div class="section-label" id="incomplete-label">Incomplete</div>
            <div class="status-text" id="incomplete"></div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://api.datadunkers.ca";
        let globalTraits = [];
        let globalPhotos = [];
        let globalShots = [];
        const COLLECTIONS = [
            { id: "data_skaters_traits", name: "Traits" },
            { id: "data_skaters_photos", name: "Photos" },
            { id: "data_skaters_shots", name: "Shots" }
        ];

        async function fetchAllRecords(collectionId, updateStatus) {
            const eventKey = localStorage.getItem('event_key');
            let records = [];
            let page = 1;
            const perPage = 500;
            
            while (true) {
                updateStatus(`Fetching ${collectionId} (page ${page})...`);
                const filterStr = eventKey ? `&filter=(event_key='${eventKey}')` : '';
                const response = await fetch(`${BASE_URL}/api/collections/${collectionId}/records?page=${page}&perPage=${perPage}${filterStr}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed to fetch ${collectionId}`);
                }
                const data = await response.json();
                
                const items = data.items || [];
                if (items.length === 0) {
                    break;
                }
                records.push(...items);
                
                if (page >= data.totalPages) {
                    break;
                }
                page++;
            }
            return records;
        }

        function getGroupForNickname(nickname, traits, photos, shots) {
            const normalizedNickname = nickname.trim().toLowerCase();
            for (const records of [photos, traits, shots]) {
                const record = records.find(r =>
                    r.nickname &&
                    r.nickname.trim().toLowerCase() === normalizedNickname &&
                    r.group !== undefined &&
                    r.group !== null &&
                    String(r.group).trim() !== ""
                );
                if (record) return record.group;
            }
            return null;
        }

        function renderAllTables() {
            const dateFilter = document.getElementById("date-select").value;
            const groupFilter = document.getElementById("group-select").value;
            const filterFn = rec => {
                if (dateFilter === "All Dates") return true;
                if (!rec.created) return true;
                return rec.created.split(" ")[0] === dateFilter;
            };

            let fTraits = globalTraits.filter(filterFn);
            let fPhotos = globalPhotos.filter(filterFn);
            let fShots = globalShots.filter(filterFn);

            // Photo groups take precedence over group values in other collections.
            if (groupFilter !== "All Groups") {
                const members = new Set();
                [...fTraits, ...fPhotos, ...fShots].forEach(record => {
                    if (!record.nickname) return;
                    const group = getGroupForNickname(record.nickname, fTraits, fPhotos, fShots);
                    if (group !== null && String(group).trim() === groupFilter) {
                        members.add(record.nickname.trim().toLowerCase());
                    }
                });
                const inGroup = r => r.nickname && members.has(r.nickname.trim().toLowerCase());
                fTraits = fTraits.filter(inGroup);
                fPhotos = fPhotos.filter(inGroup);
                fShots = fShots.filter(inGroup);
            }

            const submissionContainer = document.getElementById('submission-container');
            const submissionLabel = document.getElementById('submission-label');
            const table = document.getElementById('submission-table');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');

            thead.innerHTML = '';
            tbody.innerHTML = '';
            const incompleteDiv = document.getElementById('incomplete');
            const incompleteNicknames = [];
            incompleteDiv.textContent = '';

            if (fTraits.length === 0 && fPhotos.length === 0 && fShots.length === 0) {
                submissionContainer.style.display = 'none';
                submissionLabel.style.display = 'none';
                return;
            }

            // Get all unique distances
            const distances = new Set();
            globalShots.forEach(s => {
                if(s.distance) distances.add(String(s.distance).trim());
            });
            const sortedDistances = Array.from(distances).sort((a,b) => {
                const numA = parseFloat(a);
                const numB = parseFloat(b);
                if(!isNaN(numA) && !isNaN(numB)) return numA - numB;
                return a.localeCompare(b);
            });

            // Columns layout: Nickname | Group | Traits | Photo | [Distance 1] | [Distance 2] | ...
            const trHead = document.createElement('tr');
            trHead.innerHTML = `
                <th>Nickname</th>
                <th class="extracted-style-4">Group</th>
                <th class="extracted-style-4">Traits</th>
                <th class="extracted-style-4">Photo</th>
            `;
            sortedDistances.forEach(d => {
                const th = document.createElement('th');
                th.style.textAlign = 'center';
                th.textContent = `Distance: ${d}`;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            // Get all unique nicknames from filtered data
            const nicknames = new Set();
            fTraits.forEach(t => { if(t.nickname) nicknames.add(t.nickname.trim()); });
            fPhotos.forEach(p => { if(p.nickname) nicknames.add(p.nickname.trim()); });
            fShots.forEach(s => { if(s.nickname) nicknames.add(s.nickname.trim()); });

            const sortedNicknames = Array.from(nicknames).sort((a, b) => a.localeCompare(b, undefined, {sensitivity: 'base'}));

            // Populate rows
            sortedNicknames.forEach(nick => {
                const tr = document.createElement('tr');
                
                const tdNick = document.createElement('td');
                tdNick.textContent = nick;
                tdNick.style.fontWeight = '600';
                tr.appendChild(tdNick);

                let group = "-";
                const userGroup = getGroupForNickname(nick, fTraits, fPhotos, fShots);
                if (userGroup !== null) group = userGroup;

                const tdGroup = document.createElement('td');
                tdGroup.style.textAlign = 'center';
                tdGroup.textContent = group;
                tr.appendChild(tdGroup);

                const hasTraits = fTraits.some(t => t.nickname && t.nickname.trim().toLowerCase() === nick.toLowerCase());
                const tdTraits = document.createElement('td');
                tdTraits.style.textAlign = 'center';
                tdTraits.innerHTML = hasTraits ? '<span class="extracted-style-5">✔</span>' : '<span class="extracted-style-6">✘</span>';
                tr.appendChild(tdTraits);

                const hasPhoto = fPhotos.some(p => p.nickname && p.nickname.trim().toLowerCase() === nick.toLowerCase());
                const tdPhoto = document.createElement('td');
                tdPhoto.style.textAlign = 'center';
                tdPhoto.innerHTML = hasPhoto ? '<span class="extracted-style-5">✔</span>' : '<span class="extracted-style-6">✘</span>';
                tr.appendChild(tdPhoto);

                let complete = hasTraits && hasPhoto;
                sortedDistances.forEach(d => {
                    const hasShot = fShots.some(s => s.nickname && s.nickname.trim().toLowerCase() === nick.toLowerCase() && String(s.distance).trim() === d);
                    if (!hasShot) complete = false;
                    const tdShot = document.createElement('td');
                    tdShot.style.textAlign = 'center';
                    tdShot.innerHTML = hasShot ? '<span class="extracted-style-5">✔</span>' : '<span class="extracted-style-6">✘</span>';
                    tr.appendChild(tdShot);
                });
                if (!complete) incompleteNicknames.push(nick);

                tbody.appendChild(tr);
            });

            incompleteDiv.textContent = incompleteNicknames.join(', ') || 'None';

            submissionContainer.style.display = 'block';
            submissionLabel.style.display = 'block';

            makeTableSortable(table);
        }

        function makeTableSortable(table) {
            const headers = table.querySelectorAll('th');
            const tbody = table.querySelector('tbody');
            
            headers.forEach((header, index) => {
                header.style.cursor = 'pointer';
                header.style.userSelect = 'none';
                header.title = "Click to sort";
                
                header.addEventListener('click', () => {
                    const isAscending = header.classList.contains('sort-asc');
                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    
                    // Clear all sort classes and indicators
                    headers.forEach(h => {
                        h.classList.remove('sort-asc', 'sort-desc');
                        h.textContent = h.textContent.replace(' ▲', '').replace(' ▼', '');
                    });
                    
                    let sortMultiplier = 1;
                    if (isAscending) {
                        header.classList.add('sort-desc');
                        header.textContent += ' ▼';
                        sortMultiplier = -1;
                    } else {
                        header.classList.add('sort-asc');
                        header.textContent += ' ▲';
                        sortMultiplier = 1;
                    }
                    
                    rows.sort((a, b) => {
                        const aText = a.children[index].textContent.trim();
                        const bText = b.children[index].textContent.trim();
                        
                        const aNum = parseFloat(aText);
                        const bNum = parseFloat(bText);
                        
                        let comparison = 0;
                        if (aText !== "" && bText !== "" && !isNaN(aNum) && !isNaN(bNum)) {
                            comparison = aNum - bNum;
                        } else {
                            comparison = aText.localeCompare(bText);
                        }
                        
                        return comparison * sortMultiplier;
                    });
                    
                    tbody.append(...rows);
                });
            });
        }
        function populateFilterOptions() {
            const dates = new Set();
            [...globalTraits, ...globalPhotos, ...globalShots].forEach(rec => {
                if (rec.created) dates.add(rec.created.split(" ")[0]);
            });
            const select = document.getElementById("date-select");
            const prevDate = select.value;
            select.length = 1;
            Array.from(dates).sort().reverse().forEach(date => {
                const option = document.createElement("option");
                option.value = date;
                option.textContent = date;
                select.appendChild(option);
            });
            if (dates.has(prevDate)) select.value = prevDate;

            const groups = new Set();
            const nicknames = new Set();
            [...globalTraits, ...globalPhotos, ...globalShots].forEach(record => {
                if (record.nickname) nicknames.add(record.nickname.trim());
            });
            nicknames.forEach(nickname => {
                const group = getGroupForNickname(nickname, globalTraits, globalPhotos, globalShots);
                if (group !== null) groups.add(String(group).trim());
            });
            const groupSelect = document.getElementById("group-select");
            const prevGroup = groupSelect.value !== "All Groups" ? groupSelect.value : localStorage.getItem('collected_group_filter');
            groupSelect.length = 1;
            Array.from(groups).sort((a, b) => {
                const numA = parseFloat(a);
                const numB = parseFloat(b);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                return a.localeCompare(b);
            }).forEach(g => {
                const option = document.createElement("option");
                option.value = g;
                option.textContent = g;
                groupSelect.appendChild(option);
            });
            if (prevGroup && groups.has(prevGroup)) groupSelect.value = prevGroup;
        }

        let refreshTimer = null;
        let refreshing = false;

        async function refreshData() {
            if (refreshing) return;
            refreshing = true;
            try {
                const [traits, photos, shots] = await Promise.all(
                    COLLECTIONS.map(c => fetchAllRecords(c.id, () => {}))
                );
                globalTraits = traits;
                globalPhotos = photos;
                globalShots = shots;
                populateFilterOptions();
                renderAllTables();
            } catch (error) {
                console.error("Auto-refresh failed", error);
            } finally {
                refreshing = false;
            }
        }

        function setupAutoRefresh() {
            const toggle = document.getElementById("autorefresh-toggle");
            const apply = () => {
                clearInterval(refreshTimer);
                refreshTimer = toggle.checked ? setInterval(refreshData, 30000) : null; // refresh every 30 seconds
                localStorage.setItem('collected_autorefresh', toggle.checked ? '1' : '0');
            };
            toggle.checked = localStorage.getItem('collected_autorefresh') === '1';
            toggle.addEventListener("change", apply);
            apply();
        }

        function setupDateFilter() {
            populateFilterOptions();
            document.getElementById("filter-container").style.display = "flex";
            document.getElementById("date-select").addEventListener("change", () => renderAllTables());
            document.getElementById("group-select").addEventListener("change", (e) => {
                localStorage.setItem('collected_group_filter', e.target.value);
                renderAllTables();
            });
            setupAutoRefresh();
        }

        async function downloadAll() {
            const statusText = document.getElementById("status-text");
            const progressBar = document.getElementById("data-progress");
            const progressContainer = document.getElementById("progress-container");

            let currentProgress = 0;
            const progressPerCollection = 100 / COLLECTIONS.length;

            try {
                // Fetch Traits
                globalTraits = await fetchAllRecords(COLLECTIONS[0].id, (status) => {
                    statusText.textContent = status;
                });
                currentProgress += progressPerCollection;
                progressBar.value = currentProgress;

                // Fetch Photos/Names
                globalPhotos = await fetchAllRecords(COLLECTIONS[1].id, (status) => {
                    statusText.textContent = status;
                });
                currentProgress += progressPerCollection;
                progressBar.value = currentProgress;

                // Fetch Shots
                globalShots = await fetchAllRecords(COLLECTIONS[2].id, (status) => {
                    statusText.textContent = status;
                });
                currentProgress += progressPerCollection;
                progressBar.value = currentProgress;

                // Done
                statusText.textContent = "Data successfully loaded!";
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    setupDateFilter();
                    renderAllTables();
                }, 500);

            } catch (error) {
                console.error(error);
                statusText.textContent = "Error downloading data. Check console.";
                statusText.style.color = "red";
            }
        }

        // Start automatically
        window.addEventListener("DOMContentLoaded", () => {
            const eventKey = localStorage.getItem('event_key');
            if (!eventKey) {
                window.location.href = '../index.html';
                return;
            }
            downloadAll();
        });
    </script>
</body>
</html>
