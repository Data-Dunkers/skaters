<!DOCTYPE html>
<html lang="en" data-page="rocketleague-index">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Skaters Rocket League Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="page-header">
    <div class="eyebrow">Data Science x Hockey</div>
    <h1>Rocket League <span>Data Input</span></h1>
</div>

<div class="card">


    <div class="form-section">
        <div class="section-label">Match Results</div>
        <form id="rocketLeagueForm">
        <div class="form-row cols-2">
            
            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" placeholder="e.g. PS43" required oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')" class="extracted-style-1">
            </div>
            <div class="form-group">
                <label for="score">Score</label>
                <input type="number" id="score" name="score" min="0" max="10000" step="1" placeholder="50" required>
            </div>
            <div class="form-group">
                <label for="goals">Goals</label>
                <input type="number" id="goals" name="goals" min="0" max="100" step="1" placeholder="5" required>
            </div>
            <div class="form-group">
                <label for="assists">Assists</label>
                <input type="number" id="assists" name="assists" min="0" max="100" step="1" placeholder="5" required>
            </div>
            <div class="form-group">
                <label for="saves">Saves</label>
                <input type="number" id="saves" name="saves" min="0" max="100" step="1" placeholder="5" required>
            </div>
            <div class="form-group">
                <label for="shots">Shots</label>
                <input type="number" id="shots" name="shots" min="0" max="100" step="1" placeholder="5" required>
            </div>
        </div>
        <br>
        <button type="submit" id="submitBtn" class="submit-btn">Submit Results</button>
        </form>
    </div>

    <div id="statusMessage"></div>
</div>
<div class="home-link-wrap"><a class="home-link" href="../index.html">Home</a></div>
<script>
const PB_URL = 'https://api.datadunkers.ca/api/collections/data_skaters_rocket_league/records';

document.addEventListener('DOMContentLoaded', () => {
    const eventKey = localStorage.getItem('event_key');
    if (!eventKey) {
        window.location.href = '../index.html';
        return;
    }

    document.getElementById('rocketLeagueForm').addEventListener('submit', handleSubmit);
});

function showStatus(msg, type) {
    const el = document.getElementById('statusMessage');
    el.textContent = msg;
    el.className = type === 'success' ? 'status-success' : 'status-error';
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 3500);
}


async function handleSubmit(event) {
    event.preventDefault();
    const nickname = document.getElementById('nickname').value.trim();
    const score = parseInt(document.getElementById('score').value, 10);
    const goals = parseInt(document.getElementById('goals').value, 10);
    const assists = parseInt(document.getElementById('assists').value, 10);
    const saves = parseInt(document.getElementById('saves').value, 10);
    const shots = parseInt(document.getElementById('shots').value, 10);

    if (!nickname || Number.isNaN(score) || Number.isNaN(goals) || Number.isNaN(assists) || Number.isNaN(saves) || Number.isNaN(shots)) {
        showStatus('Please complete all required fields.', 'error');
        return;
    }

    const payload = {
        nickname: nickname,
        score: score,
        goals: goals,
        assists: assists,
        saves: saves,
        shots: shots,
        event_key: localStorage.getItem('event_key')
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
        const res = await fetch(PB_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            let message = 'Server error ' + res.status;
            try {
                const errorData = await res.json();
                if (errorData.message) message += ': ' + errorData.message;
            } catch (_) {}
            throw new Error(message);
        }

        showStatus('Results submitted successfully.', 'success');

        document.getElementById('nickname').value = '';
        document.getElementById('score').value = '';
        document.getElementById('goals').value = '';
        document.getElementById('assists').value = '';
        document.getElementById('saves').value = '';
        document.getElementById('shots').value = '';

    } catch (err) {
        showStatus('Error: ' + err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Results';
    }
}
</script>

</body>
</html>
